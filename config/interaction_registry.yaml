    phases: [pre_snap]
    mechanisms: [active_roster, personnel_package, substitution]
  effectiveness_if_active:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group, unit, 11v11]
    phases: [pre_snap, initial_contact, development, resolution]
    mechanisms: [personnel_package, pass_protection, pass_rush, separation, coverage, run_contact, tackle_contact]
  route_participation:
    entity_scopes: [player]
    interaction_scales: [11v11]
    phases: [pre_snap]
    mechanisms: [personnel_package, route_assignment]
  target_share:
    entity_scopes: [player]
    interaction_scales: [11v11]
    phases: [pre_snap, development]
    mechanisms: [route_assignment, target_selection]
  rush_share:
    entity_scopes: [player]
    interaction_scales: [11v11]
    phases: [pre_snap]
    mechanisms: [personnel_package, rusher_selection]
  red_zone_target_share:
    entity_scopes: [player]
    interaction_scales: [11v11]
    phases: [pre_snap, development]
    mechanisms: [red_zone_assignment, target_selection]
  red_zone_rush_share:
    entity_scopes: [player]
    interaction_scales: [11v11]
    phases: [pre_snap]
    mechanisms: [red_zone_assignment, rusher_selection]
  unit_continuity:
    entity_scopes: [unit, team]
    interaction_scales: [small_group, unit, 11v11]
    phases: [pre_snap, initial_contact, development]
    mechanisms: [communication, pass_protection, run_blocking, coverage_exchange]

  # Team behavior / drive conversion
  neutral_pass_rate:
