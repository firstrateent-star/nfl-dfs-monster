name: v6.3.7 Gadget Rush Incidence OOS

on:
  push:
    branches: [work/v637-gadget-rush-entry]
    paths:
      - benchmarks/v637_gadget_incidence_oos_launch.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Unit-test incidence audit
        run: uv run pytest -q tests/test_gadget_rush_incidence_oos_v637.py
      - name: Lint incidence audit
        run: >-
          uv run ruff check
          src/monster/feature_compile/gadget_rush_incidence_v637.py
          scripts/audit_gadget_rush_incidence_oos_v637.py
          tests/test_gadget_rush_incidence_oos_v637.py
      - name: Run 2022-2025 market-blind incidence audit
        run: >-
          uv run python scripts/audit_gadget_rush_incidence_oos_v637.py
          --seasons 2022 2023 2024 2025
          --out artifacts/v637-gadget-incidence-oos
      - name: Upload incidence evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v637-gadget-incidence-oos-${{ github.run_id }}
          path: artifacts/v637-gadget-incidence-oos/
          retention-days: 30
