name: Cancel superseded V7.2.6 MNF run

on:
  push:
    branches: [work/v726-series-survival-ecology]
    paths:
      - benchmarks/v726_mnf_cancel_superseded.txt

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel duplicate 600-world run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 35669994248 --repo "$GITHUB_REPOSITORY" || true
