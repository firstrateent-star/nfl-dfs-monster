    audit_only: true

  # Market evidence is explicitly diagnostic/downstream only.
  sportsbook_total:
    entity_scopes: [game]
    interaction_scales: [game_state]
    phases: [post_play]
    mechanisms: [market_audit]
    audit_only: true
  sportsbook_spread:
    entity_scopes: [game]
