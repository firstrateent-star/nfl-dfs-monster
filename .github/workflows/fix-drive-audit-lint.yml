name: Fix drive audit lint

on:
  push:
    branches: [feature/football-state-v13-clock]
    paths:
      - .github/workflows/fix-drive-audit-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Apply Ruff-only fixes
        run: >-
          uv run ruff check --fix --unsafe-fixes
          scripts/audit_week1_drive_reality.py
          scripts/audit_historical_drive_reality.py
          scripts/compare_drive_reality.py
      - name: Verify code and tests
        run: |
          uv run ruff check src tests scripts/audit_week1_drive_reality.py scripts/audit_historical_drive_reality.py scripts/compare_drive_reality.py
          uv run pytest -q
      - name: Commit lint-only repair
        run: |
          rm .github/workflows/fix-drive-audit-lint.yml
          git config user.name "monster-ci"
          git config user.email "monster-ci@users.noreply.github.com"
          git add -A
          git commit -m "Fix drive reality audit lint"
          git push origin HEAD:feature/football-state-v13-clock
