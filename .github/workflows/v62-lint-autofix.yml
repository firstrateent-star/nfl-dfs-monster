name: V6.2 lint autofix

on:
  push:
    branches: [work/reality-loop-v2-test]
    paths:
      - .github/workflows/v62-lint-autofix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reality-loop-v2-test
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Apply Ruff fixes
        run: |
          uv run ruff check src tests --ignore RUF046 --fix
          uv run ruff check scripts/run_reality_loop_v62.py --ignore RUF046 --fix
      - name: Commit fixes if needed
        run: |
          if git diff --quiet; then
            echo "No lint fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts/run_reality_loop_v62.py
          git commit -m "Fix v6.2 lint and existing Ruff drift"
          git push origin HEAD:work/reality-loop-v2-test
