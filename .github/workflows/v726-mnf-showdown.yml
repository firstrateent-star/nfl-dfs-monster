name: V7.2.6 NYG at LAR MNF Showdown

on:
  push:
    branches: [work/v726-series-survival-ecology]
    paths:
      - benchmarks/v726_mnf_launch.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v726-mnf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Lint V7.2.6 MNF path
        run: >-
          uv run ruff check
          scripts/build_week2_2026_mnf_pregame.py
          scripts/run_week2_v726_mnf.py
          scripts/runtime_v726_composer.py
          tests/test_v726_series_survival.py

      - name: Require V7.2.6 causal gates
        run: >-
          uv run pytest -q
          tests/test_v726_series_survival.py
          tests/test_v725_possession_ecology.py
          tests/test_drive_trace.py
          tests/test_v724_collapse_consequence.py
          tests/test_v723_failure_calibration.py
          tests/test_v722_failure_paths.py
          tests/test_v721_game_script.py
          tests/test_market_blind_guard.py

      - name: Build Monday live Week 2 personnel
        run: >-
          uv run python scripts/build_week2_2026_mnf_pregame.py
          --season 2026
          --history 2025
          --recent-games 6
          --out artifacts/week2-mnf-pregame

      - name: Build Week 1-only Week 2 policy
        run: >-
          uv run python scripts/build_week2_2026_policy.py
          --prior-seasons 2025
          --current-season 2026
          --through-week 1
          --out artifacts/week2-mnf-policy

      - name: Build older continuity policy
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2024
          --out artifacts/league-policy-2024

      - name: Build Monday health state
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/week2-mnf-pregame/league_personnel.parquet
          --injuries artifacts/week2-mnf-pregame/raw_injuries.parquet
          --overrides config/health/week2_2026_mnf_2026-09-21.csv
          --season 2026
          --out artifacts/week2-mnf-health

      - name: Require official inactive state
        run: |
          uv run python - <<'PY'
          import polars as pl
          p=pl.read_parquet("artifacts/week2-mnf-health/health_personnel.parquet")
          checks={
              ("LAR","Puka Nacua"),
              ("LAR","Jordan Whittington"),
              ("NYG","Deonte Banks"),
              ("NYG","Micah McFadden"),
          }
          rows={(r["team_id"],r["display_name"]):r for r in p.to_dicts()}
          for key in checks:
              assert key in rows, key
              assert rows[key]["health_availability_probability"] == 0.0, (key, rows[key]["health_availability_probability"])
          print("official inactive overrides verified")
          PY

      - name: Build continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/week2-mnf-policy/team_policy.parquet
          --personnel artifacts/week2-mnf-health/health_personnel.parquet
          --out artifacts/week2-mnf-continuity-policy

      - name: Run 600 V7.2.6 NYG at LAR worlds
        run: >-
          uv run python scripts/run_week2_v726_mnf.py
          --policy artifacts/week2-mnf-continuity-policy/team_policy.parquet
          --personnel artifacts/week2-mnf-health/health_personnel.parquet
          --player-usage artifacts/week2-mnf-policy/player_usage.parquet
          --situation-context artifacts/week2-mnf-policy/situational_pass_context.parquet
          --worlds 600
          --seed 2026092126
          --progress-every 100
          --first-out artifacts/week2-v726-mnf
          --box-out artifacts/week2-v726-mnf-box

      - name: Require V7.2.6 runtime fingerprint
        run: |
          test -f artifacts/week2-v726-mnf/runtime_fingerprint_v726.json
          uv run python - <<'PY'
          import json
          p=json.load(open("artifacts/week2-v726-mnf/runtime_fingerprint_v726.json"))
          assert p["early_down_run_survival_active"] is True
          assert p["early_down_negative_completion_priors_active"] is True
          assert p["third_down_execution_directly_adjusted"] is False
          assert p["market_inputs_to_football"] is False
          assert p["direct_score_adjustment"] is False
          print(json.dumps(p, indent=2))
          PY

      - name: Upload V7.2.6 MNF worlds
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v726-nyg-lar-mnf-${{ github.run_id }}
          path: |
            artifacts/week2-v726-mnf/
            artifacts/week2-v726-mnf-box/
            artifacts/week2-mnf-health/
            artifacts/week2-mnf-policy/pass_depth_outcomes.csv
            artifacts/week2-mnf-policy/run_geometry_outcomes.csv
            config/health/week2_2026_mnf_2026-09-21.csv
          retention-days: 30
