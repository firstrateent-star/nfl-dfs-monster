name: Monster v1.3 paired identity authority shadow

on:
  push:
    branches: [feature/football-state-v13-clock]
    paths:
      - src/monster/feature_compile/identity_channels.py
      - src/monster/feature_compile/v13_identity_bridge.py
      - src/monster/feature_compile/v13_identity_authority.py
      - scripts/run_week1_v13_identity_authority_shadow.py
      - scripts/compare_identity_authority_shadow.py
      - tests/test_v13_identity_authority.py
      - .github/workflows/v13-identity-authority-shadow.yml
  workflow_dispatch:

jobs:
  identity-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Software and causal gates
        run: |
          uv run ruff check src tests scripts/run_week1_v13_first_sim.py scripts/run_week1_v13_stage3_shadow.py scripts/run_week1_v13_identity_authority_shadow.py scripts/compare_identity_authority_shadow.py
          uv run pytest -q
      - name: Build current 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline
      - name: Build market-blind historical priors
        run: |
          uv run python scripts/build_league_policy.py --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py --history 2024 --out artifacts/league-policy-2024
      - name: Build current Week 1 health snapshot
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026 --out artifacts/week1-health
      - name: Compile continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --out artifacts/continuity-policy
      - name: Run Stage 3 control
        run: >-
          uv run python scripts/run_week1_v13_stage3_shadow.py
          --game-flow-league artifacts/league-policy/game_flow_league.parquet
          --game-flow-team artifacts/league-policy/game_flow_team.parquet
          --pass-depth-league artifacts/league-policy/pass_depth_league.parquet
          --pass-depth-team artifacts/league-policy/pass_depth_team.parquet
          --pass-depth-qb artifacts/league-policy/pass_depth_qb.parquet
          --pass-depth-outcomes artifacts/league-policy/pass_depth_outcomes.parquet
          --target-depth artifacts/league-policy/target_depth.parquet
          --run-geometry-league artifacts/league-policy/run_geometry_league.parquet
          --run-geometry-team artifacts/league-policy/run_geometry_team.parquet
          --run-geometry-rusher artifacts/league-policy/run_geometry_rusher.parquet
          --run-geometry-outcomes artifacts/league-policy/run_geometry_outcomes.parquet
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 250 --seed 2026091050
          --out artifacts/identity-authority/control
      - name: Run Stage 3 rich identity treatment
        run: >-
          uv run python scripts/run_week1_v13_identity_authority_shadow.py
          --game-flow-league artifacts/league-policy/game_flow_league.parquet
          --game-flow-team artifacts/league-policy/game_flow_team.parquet
          --pass-depth-league artifacts/league-policy/pass_depth_league.parquet
          --pass-depth-team artifacts/league-policy/pass_depth_team.parquet
          --pass-depth-qb artifacts/league-policy/pass_depth_qb.parquet
          --pass-depth-outcomes artifacts/league-policy/pass_depth_outcomes.parquet
          --target-depth artifacts/league-policy/target_depth.parquet
          --run-geometry-league artifacts/league-policy/run_geometry_league.parquet
          --run-geometry-team artifacts/league-policy/run_geometry_team.parquet
          --run-geometry-rusher artifacts/league-policy/run_geometry_rusher.parquet
          --run-geometry-outcomes artifacts/league-policy/run_geometry_outcomes.parquet
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 250 --seed 2026091050
          --out artifacts/identity-authority/repair
      - name: Compare identity authority
        run: >-
          uv run python scripts/compare_identity_authority_shadow.py
          --control artifacts/identity-authority/control
          --repair artifacts/identity-authority/repair
          --out artifacts/identity-authority/comparison
      - name: Verify identity treatment was exercised
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import polars as pl

          root = Path('artifacts/identity-authority')
          manifest = json.loads((root/'repair'/'manifest.json').read_text())
          comparison = json.loads((root/'comparison'/'identity_authority_comparison.json').read_text())
          trace = pl.read_csv(root/'repair'/'identity_authority_trace.csv')
          assert manifest['rich_identity_authority_active'] is True
          assert manifest['direct_point_adjustment'] is False
          assert manifest['stage3_resolution_ecology_active'] is True
          assert trace.height == 24
          assert trace.get_column('players_with_capability_evidence').min() > 0
          assert comparison['market_blind'] is True
          assert comparison['paired_common_random_numbers'] is True
          assert comparison['mean_absolute_team_score_change'] > 0
          print(json.dumps(comparison, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v1-3-identity-authority-shadow
          path: artifacts/identity-authority/
          retention-days: 14
