name: v7 Reality Engine Foundation

on:
  push:
    branches: [work/v7-reality-engine]
    paths:
      - 'src/monster/reality/**'
      - 'tests/test_reality_engine_v7.py'
      - 'tests/test_v7_live_state.py'
      - 'tests/test_v7_participation_opportunity.py'
      - 'tests/test_v7_qb_rush_families.py'
      - 'tests/test_v7_game_latents.py'
      - 'tests/test_v7_ledger_reducers.py'
      - 'tests/test_v7_identity_catalog.py'
      - 'tests/test_v7_latent_authority.py'
      - 'tests/test_v7_qb_rush_family_audit.py'
      - 'tests/test_v7_qb_rush_authority.py'
      - 'scripts/audit_simulated_qb_rush_families_v7.py'
      - 'scripts/runtime_v701_composer.py'
      - 'scripts/run_reality_loop_v701.py'
      - 'tests/test_v701_runtime.py'
      - 'scripts/audit_full_game_counterfactual_v701.py'
      - 'scripts/audit_coaching_policy_identity_v701.py'
      - 'scripts/compare_week1_v700_v701.py'
      - 'scripts/compare_qb_rush_families_v700_v701.py'
      - '.github/workflows/v701-qb-rush-week1.yml'
      - 'docs/V7_REALITY_ENGINE_CONSTITUTION.md'
      - '.github/workflows/v7-reality-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Lint v7 foundation
        run: >-
          uv run ruff check
          src/monster/reality
          tests/test_reality_engine_v7.py
          tests/test_v7_live_state.py
          tests/test_v7_participation_opportunity.py
          tests/test_v7_qb_rush_families.py
          tests/test_v7_game_latents.py
          tests/test_v7_ledger_reducers.py
          tests/test_v7_identity_catalog.py
          tests/test_v7_latent_authority.py
          tests/test_v7_qb_rush_family_audit.py
          tests/test_v7_qb_rush_authority.py
          scripts/audit_simulated_qb_rush_families_v7.py
          scripts/runtime_v701_composer.py
          scripts/run_reality_loop_v701.py
          tests/test_v701_runtime.py
          scripts/audit_full_game_counterfactual_v701.py
          scripts/audit_coaching_policy_identity_v701.py
          scripts/compare_week1_v700_v701.py
          scripts/compare_qb_rush_families_v700_v701.py
      - name: Run v7 foundation and inherited conservation gates
        run: >-
          uv run pytest -q
          tests/test_reality_engine_v7.py
          tests/test_v7_live_state.py
          tests/test_v7_participation_opportunity.py
          tests/test_v7_qb_rush_families.py
          tests/test_v7_game_latents.py
          tests/test_v7_ledger_reducers.py
          tests/test_v7_identity_catalog.py
          tests/test_v7_latent_authority.py
          tests/test_v7_qb_rush_family_audit.py
          tests/test_v7_qb_rush_authority.py
          tests/test_v701_runtime.py
          tests/test_event_ledger.py
          tests/test_football_state.py
          tests/test_reality_snap_v5.py
          tests/test_market_blind_guard.py
