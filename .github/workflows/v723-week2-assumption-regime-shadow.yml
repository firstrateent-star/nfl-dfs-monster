name: v7.2.3 Week 2 Assumption Regime Shadow

on:
  push:
    branches: [work/v723-assumption-regimes]
    paths:
      - benchmarks/v723_week2_shadow_launch.txt
  workflow_dispatch:
    inputs:
      worlds:
        description: Worlds per game
        required: false
        default: "40"

permissions:
  contents: read
  actions: read

concurrency:
  group: v723-week2-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Lint V7.2.3
        run: >-
          uv run ruff check
          scripts/run_week1_v13_integrated.py
          scripts/runtime_v723_composer.py
          scripts/run_reality_loop_v723.py
          scripts/run_week2_v723_main_slate.py
          scripts/audit_v723_premise_robustness.py
          scripts/benchmark_v723_week2_reality.py
          src/monster/reality/world_premise_v723.py
          src/monster/reality/premise_robustness_v723.py
          src/monster/reality/week2_reality_benchmark_v723.py
          tests/test_v723_world_premise.py
          tests/test_v723_diagnostics.py

      - name: Require V7.2.3 and inherited causal gates
        run: >-
          uv run pytest -q
          tests/test_v723_world_premise.py
          tests/test_v723_diagnostics.py
          tests/test_v722_world_availability.py
          tests/test_v721_game_script.py
          tests/test_v72_reality_engine.py
          tests/test_v701_runtime.py
          tests/test_market_blind_guard.py

      - name: Build Saturday live Week 2 personnel
        run: >-
          uv run python scripts/build_week2_2026_live_pregame.py
          --season 2026
          --history 2025
          --recent-games 6
          --out artifacts/week2-live-pregame

      - name: Build Week 1-only Week 2 policy
        run: >-
          uv run python scripts/build_week2_2026_policy.py
          --prior-seasons 2025
          --current-season 2026
          --through-week 1
          --out artifacts/week2-live-policy

      - name: Build older continuity policy
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2024
          --out artifacts/league-policy-2024

      - name: Build Saturday health state
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/week2-live-pregame/league_personnel.parquet
          --injuries artifacts/week2-live-pregame/raw_injuries.parquet
          --overrides config/health/week2_2026_live_2026-09-19.csv
          --season 2026
          --out artifacts/week2-live-health

      - name: Build continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/week2-live-policy/team_policy.parquet
          --personnel artifacts/week2-live-health/health_personnel.parquet
          --out artifacts/week2-live-continuity-policy

      - name: Run V7.2.3 main-slate shadow worlds
        env:
          WORLDS: ${{ inputs.worlds || '40' }}
        run: >-
          uv run python scripts/run_week2_v723_main_slate.py
          --policy artifacts/week2-live-continuity-policy/team_policy.parquet
          --personnel artifacts/week2-live-health/health_personnel.parquet
          --player-usage artifacts/week2-live-policy/player_usage.parquet
          --situation-context artifacts/week2-live-policy/situational_pass_context.parquet
          --worlds "$WORLDS"
          --seed 2026092022
          --progress-every "$WORLDS"
          --first-out artifacts/week2-v723-main
          --box-out artifacts/week2-v723-main-box

      - name: Build premise-robustness audit
        run: >-
          uv run python scripts/audit_v723_premise_robustness.py
          --player-world artifacts/week2-v723-main/player_world_fanduel.csv
          --premise artifacts/week2-v723-main/world_premise_v723.csv
          --out artifacts/week2-v723-main/premise_robustness_v723.csv
          --minimum-regime-worlds 3

      - name: Grade game distributions against Week 2 reality
        run: >-
          uv run python scripts/benchmark_v723_week2_reality.py
          --projected artifacts/week2-v723-main/game_distributions.csv
          --actual benchmarks/week2_2026_main_slate_actual_scores.csv
          --detail-out artifacts/week2-v723-main/week2_reality_detail_v723.csv
          --summary-out artifacts/week2-v723-main/week2_reality_summary_v723.json

      - name: Require premise telemetry and runtime fingerprint
        run: |
          test -f artifacts/week2-v723-main/runtime_fingerprint_v723.json
          test -f artifacts/week2-v723-main/world_premise_v723.csv
          uv run python - <<'PY'
          import json
          import polars as pl

          p = json.load(open("artifacts/week2-v723-main/runtime_fingerprint_v723.json"))
          assert p["world_binary_availability_active"] is True
          assert p["existing_role_uncertainty_reused"] is True
          assert p["coherent_game_day_latents_active"] is True
          assert p["direct_score_adjustment"] is False
          assert p["direct_fantasy_adjustment"] is False
          rows = pl.read_csv("artifacts/week2-v723-main/world_premise_v723.csv")
          assert rows.height > 0
          assert {"collapse", "fragile", "normal", "surge"}.issuperset(
              set(rows.get_column("regime").unique().to_list())
          )
          print(p)
          print(rows.group_by("regime").len().sort("regime"))
          PY

      - name: Upload V7.2.3 shadow worlds
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v723-week2-shadow-${{ github.run_id }}
          path: |
            artifacts/week2-v723-main/
            artifacts/week2-v723-main-box/
            artifacts/week2-live-health/
            config/health/week2_2026_live_2026-09-19.csv
          retention-days: 30
