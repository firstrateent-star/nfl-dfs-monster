name: v7.2.2 Week 2 Main Slate World Availability

on:
  push:
    branches: [work/v721-game-script]
    paths:
      - benchmarks/v722_week2_main_launch.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v722-week2-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Lint V7.2.2
        run: >-
          uv run ruff check
          scripts/run_week1_v13_integrated.py
          scripts/runtime_v722_composer.py
          scripts/run_reality_loop_v722.py
          scripts/run_week2_v722_main_slate.py
          src/monster/reality/world_availability_v722.py
          src/monster/reality/participation_authority_v72.py
          tests/test_v722_world_availability.py

      - name: Require V7.2.2 and inherited causal gates
        run: >-
          uv run pytest -q
          tests/test_v722_world_availability.py
          tests/test_v721_game_script.py
          tests/test_v72_reality_engine.py
          tests/test_v701_runtime.py
          tests/test_market_blind_guard.py

      - name: Build Saturday live Week 2 personnel
        run: >-
          uv run python scripts/build_week2_2026_live_pregame.py
          --season 2026
          --history 2025
          --recent-games 6
          --out artifacts/week2-live-pregame

      - name: Build Week 1-only Week 2 policy
        run: >-
          uv run python scripts/build_week2_2026_policy.py
          --prior-seasons 2025
          --current-season 2026
          --through-week 1
          --out artifacts/week2-live-policy

      - name: Build older continuity policy
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2024
          --out artifacts/league-policy-2024

      - name: Build Saturday health state
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/week2-live-pregame/league_personnel.parquet
          --injuries artifacts/week2-live-pregame/raw_injuries.parquet
          --overrides config/health/week2_2026_live_2026-09-19.csv
          --season 2026
          --out artifacts/week2-live-health

      - name: Build continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/week2-live-policy/team_policy.parquet
          --personnel artifacts/week2-live-health/health_personnel.parquet
          --out artifacts/week2-live-continuity-policy

      - name: Run corrected V7.2.2 main slate worlds
        run: >-
          uv run python scripts/run_week2_v722_main_slate.py
          --policy artifacts/week2-live-continuity-policy/team_policy.parquet
          --personnel artifacts/week2-live-health/health_personnel.parquet
          --player-usage artifacts/week2-live-policy/player_usage.parquet
          --situation-context artifacts/week2-live-policy/situational_pass_context.parquet
          --worlds 120
          --seed 2026092022
          --progress-every 120
          --first-out artifacts/week2-v722-main
          --box-out artifacts/week2-v722-main-box

      - name: Require corrected runtime fingerprint
        run: |
          test -f artifacts/week2-v722-main/runtime_fingerprint_v722.json
          uv run python - <<'PY'
          import json
          p = json.load(open("artifacts/week2-v722-main/runtime_fingerprint_v722.json"))
          assert p["world_binary_availability_active"] is True
          assert p["role_redistribution_after_availability"] is True
          print(p)
          PY

      - name: Upload corrected main-slate worlds
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v722-week2-main-worlds-${{ github.run_id }}
          path: |
            artifacts/week2-v722-main/
            artifacts/week2-v722-main-box/
            artifacts/week2-live-health/
            config/health/week2_2026_live_2026-09-19.csv
          retention-days: 30
