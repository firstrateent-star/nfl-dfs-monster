name: Reality Loop v2 drive-survival audit

on:
  push:
    branches: [work/reality-loop-v2-test]
    paths:
      - scripts/audit_reality_loop_v2_drive_survival.py
      - .github/workflows/reality-loop-v2-drive-survival.yml
  workflow_dispatch:

jobs:
  drive-survival:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Build current 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline_enriched.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline

      - name: Build market-blind historical priors
        run: |
          uv run python scripts/build_league_policy.py --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py --history 2024 --out artifacts/league-policy-2024

      - name: Build Week 1 health snapshot
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026 --out artifacts/week1-health

      - name: Compile continuity-conditioned team policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --out artifacts/continuity-policy

      - name: Audit Reality Loop v2 drive survival
        run: >-
          uv run python scripts/audit_reality_loop_v2_drive_survival.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --history 2025 --worlds 25 --seed 2026091204
          --out artifacts/reality-loop-v2-drive-survival

      - name: Print causal funnel
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import polars as pl
          out = Path('artifacts/reality-loop-v2-drive-survival')
          comparison = pl.read_csv(out / 'drive_metric_comparison.csv')
          survival = pl.read_csv(out / 'drive_survival_curve.csv')
          terminals = pl.read_csv(out / 'drive_terminal_comparison.csv')
          wanted = [
              'scrimmage_plays_per_drive','series_conversion_rate','third_down_conversion_rate',
              'third_and_long_share','third_down_distance_mean','early_down_5plus_rate',
              'early_down_run_yards_per_snap','early_down_pass_yards_per_snap',
              'early_down_run_negative_rate','early_down_pass_negative_rate',
              'explosive_plays_per_drive','red_zone_snap_drive_rate','red_zone_td_conversion_rate',
              'touchdown_drive_rate','punt_drive_rate','turnover_drive_rate','start_yardline_100_mean'
          ]
          print(comparison.filter(pl.col('metric').is_in(wanted)).sort('absolute_relative_gap', descending=True))
          print(survival)
          print(terminals)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-loop-v2-drive-survival
          path: artifacts/reality-loop-v2-drive-survival/
          retention-days: 14
