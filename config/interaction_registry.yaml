# Interaction Registry — where governed evidence is allowed to participate in football.
# This does not assign coefficients. Owning mechanisms interpret routed evidence.
interactions:
  # Physical / athletic evidence
  height_in:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group]
    phases: [resolution]
    mechanisms: [catchpoint, tackle_contact]
  weight_lbs:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group]
    phases: [initial_contact, resolution]
    mechanisms: [block_contact, run_contact, tackle_contact]
  wingspan_in:
    entity_scopes: [player]
    interaction_scales: [1v1]
    phases: [resolution]
    mechanisms: [catchpoint]
  forty_time:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group]
    phases: [development, resolution]
    mechanisms: [separation, pursuit, pressure_arrival, yac_space]
  madden_speed:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group]
    phases: [development, resolution]
    mechanisms: [separation, pursuit, pressure_arrival, yac_space]
  madden_acceleration:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group]
    phases: [development, resolution]
    mechanisms: [separation, pursuit, pressure_arrival, yac_space]
  madden_route_running:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group]
    phases: [development]
    mechanisms: [route_separation, coverage_conflict]
  madden_catching:
    entity_scopes: [player]
    interaction_scales: [1v1]
    phases: [resolution]
    mechanisms: [catchpoint]
  madden_pass_block:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group, unit]
    phases: [initial_contact, development]
    mechanisms: [pass_protection, pressure]
  madden_pass_rush:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group, unit]
    phases: [initial_contact, development]
    mechanisms: [pass_rush, pressure]
  madden_coverage:
    entity_scopes: [player]
    interaction_scales: [1v1, small_group, unit]
    phases: [development, resolution]
    mechanisms: [coverage, catchpoint, interception]

