[project]
name = "nfl-dfs-monster"
version = "0.1.0"
description = "Market-blind NFL slate simulator with downstream DFS decoders"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "nflreadpy>=0.1,<1",
  "numpy>=2.0,<3",
  "polars>=1.30,<2",
  "pyarrow>=19,<23",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "scipy>=1.15,<2",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
monster = "monster.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monster"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/monster/feature_compile/skill_pools.py" = ["DTZ011"]
