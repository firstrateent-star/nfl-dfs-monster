name: Monster v1.3 paired Stage 3 pass-run shadow

on:
  push:
    branches: [feature/football-state-v13-clock]
    paths:
      - scripts/run_week1_v13_stage3_shadow.py
      - scripts/compare_stage3_shadow.py
      - scripts/audit_week1_stage3_drive_survival.py
      - scripts/audit_historical_drive_reality.py
      - scripts/compare_drive_survival.py
      - scripts/compare_scoring_state_ecology.py
      - scripts/audit_clock_possession_ecology.py
      - src/monster/feature_compile/play_intent.py
      - src/monster/feature_compile/v13_identity_bridge.py
      - src/monster/sim/availability_world.py
      - src/monster/sim/categorical_policy.py
      - src/monster/sim/intent_ecology.py
      - src/monster/sim/resolution_ecology.py
      - src/monster/sim/play_kernel.py
      - src/monster/sim/play_anatomy.py
      - src/monster/sim/drive_trace.py
      - tests/test_stage3_resolution_ecology.py
      - tests/test_drive_survival_trace.py
      - tests/test_availability_world.py
      - tests/test_v13_availability_bridge.py
      - .github/workflows/v13-stage3-paired.yml
  workflow_dispatch:

jobs:
  paired-stage3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Causal architecture gates
        run: |
          uv run ruff check src tests scripts/run_week1_v13_first_sim.py scripts/run_week1_v13_stage3_shadow.py scripts/compare_stage3_shadow.py scripts/audit_play_intent_oos.py scripts/audit_week1_stage3_drive_survival.py scripts/audit_historical_drive_reality.py scripts/compare_drive_survival.py scripts/compare_scoring_state_ecology.py scripts/audit_clock_possession_ecology.py
          uv run pytest -q
      - name: Reconfirm pass and run intent OOS authority
        run: >-
          uv run python scripts/audit_play_intent_oos.py
          --out artifacts/stage3-paired/intent-oos
      - name: Build current 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline
      - name: Build market-blind historical priors
        run: |
          uv run python scripts/build_league_policy.py --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py --history 2024 --out artifacts/league-policy-2024
      - name: Build current Week 1 health snapshot
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026 --out artifacts/week1-health
      - name: Compile continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --out artifacts/continuity-policy
      - name: Run legacy control
        run: >-
          uv run python scripts/run_week1_v13_first_sim.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 250 --seed 2026091050
          --out artifacts/stage3-paired/legacy
      - name: Run Stage 3 shadow treatment
        run: >-
          uv run python scripts/run_week1_v13_stage3_shadow.py
          --game-flow-league artifacts/league-policy/game_flow_league.parquet
          --game-flow-team artifacts/league-policy/game_flow_team.parquet
          --pass-depth-league artifacts/league-policy/pass_depth_league.parquet
          --pass-depth-team artifacts/league-policy/pass_depth_team.parquet
          --pass-depth-qb artifacts/league-policy/pass_depth_qb.parquet
          --pass-depth-outcomes artifacts/league-policy/pass_depth_outcomes.parquet
          --target-depth artifacts/league-policy/target_depth.parquet
          --run-geometry-league artifacts/league-policy/run_geometry_league.parquet
          --run-geometry-team artifacts/league-policy/run_geometry_team.parquet
          --run-geometry-rusher artifacts/league-policy/run_geometry_rusher.parquet
          --run-geometry-outcomes artifacts/league-policy/run_geometry_outcomes.parquet
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 250 --seed 2026091050
          --out artifacts/stage3-paired/stage3
      - name: Compare whole-game and branch anatomy
        run: >-
          uv run python scripts/compare_stage3_shadow.py
          --baseline artifacts/stage3-paired/legacy
          --stage3 artifacts/stage3-paired/stage3
          --pass-historical artifacts/league-policy/pass_depth_outcomes.parquet
          --run-historical artifacts/league-policy/run_geometry_outcomes.parquet
          --out artifacts/stage3-paired/comparison
      - name: Build historical drive-survival evidence
        run: >-
          uv run python scripts/audit_historical_drive_reality.py
          --season 2025
          --cache-dir .cache/monster
          --out artifacts/stage3-paired/drive-historical
      - name: Run Stage 3 drive-survival shadow
        run: >-
          uv run python scripts/audit_week1_stage3_drive_survival.py
          --game-flow-league artifacts/league-policy/game_flow_league.parquet
          --game-flow-team artifacts/league-policy/game_flow_team.parquet
          --pass-depth-league artifacts/league-policy/pass_depth_league.parquet
          --pass-depth-team artifacts/league-policy/pass_depth_team.parquet
          --pass-depth-qb artifacts/league-policy/pass_depth_qb.parquet
          --pass-depth-outcomes artifacts/league-policy/pass_depth_outcomes.parquet
          --target-depth artifacts/league-policy/target_depth.parquet
          --run-geometry-league artifacts/league-policy/run_geometry_league.parquet
          --run-geometry-team artifacts/league-policy/run_geometry_team.parquet
          --run-geometry-rusher artifacts/league-policy/run_geometry_rusher.parquet
          --run-geometry-outcomes artifacts/league-policy/run_geometry_outcomes.parquet
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 250 --seed 2026091050
          --out artifacts/stage3-paired/drive-stage3
      - name: Compare Stage 3 drive survival with 2025 football
        run: >-
          uv run python scripts/compare_drive_survival.py
          --simulated artifacts/stage3-paired/drive-stage3/stage3_drive_traces.parquet
          --historical artifacts/stage3-paired/drive-historical/historical_drive_traces.parquet
          --out artifacts/stage3-paired/drive-survival
      - name: Compare scoring-state ecology
        run: >-
          uv run python scripts/compare_scoring_state_ecology.py
          --simulated artifacts/stage3-paired/drive-stage3/stage3_drive_traces.parquet
          --historical artifacts/stage3-paired/drive-historical/historical_drive_traces.parquet
          --out artifacts/stage3-paired/scoring-state
      - name: Audit clock and possession ecology
        run: >-
          uv run python scripts/audit_clock_possession_ecology.py
          --simulated artifacts/stage3-paired/drive-stage3/stage3_drive_traces.parquet
          --sim-manifest artifacts/stage3-paired/drive-stage3/manifest.json
          --season 2025
          --cache-dir .cache/monster
          --out artifacts/stage3-paired/clock-possession
      - name: Verify Stage 3 was actually exercised
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import polars as pl

          root = Path('artifacts/stage3-paired')
          oos = json.loads((root/'intent-oos'/'manifest.json').read_text())
          stage3 = json.loads((root/'stage3'/'manifest.json').read_text())
          comparison = json.loads((root/'comparison'/'manifest.json').read_text())
          survival = json.loads((root/'drive-survival'/'drive_survival_ledger.json').read_text())
          scoring = json.loads((root/'scoring-state'/'scoring_state_ecology.json').read_text())
          clock = json.loads((root/'clock-possession'/'clock_possession_ecology.json').read_text())
          pass_trace = pl.read_csv(root/'stage3'/'stage3_pass_depth_anatomy.csv')
          run_trace = pl.read_csv(root/'stage3'/'stage3_run_geometry_anatomy.csv')

          assert oos['gate_passed'] is True
          assert stage3['hierarchical_game_flow_active'] is True
          assert stage3['intent_ecology_active'] is True
          assert stage3['stage3_resolution_ecology_active'] is True
          assert stage3['stage3_attached_team_count'] == 24
          assert pass_trace.get_column('intent_dropbacks').sum() > 10000
          assert run_trace.get_column('attempts').sum() > 5000
          assert comparison['market_blind'] is True
          assert comparison['promotion_status'] == 'SHADOW_STAGE3_EVIDENCE_ONLY'
          assert survival['market_blind'] is True
          assert survival['behavior_changed_by_ledger'] is False
          assert survival['promotion_status'] == 'SHADOW_DIAGNOSTIC_ONLY'
          assert survival['simulated_drives'] > 10000
          assert survival['historical_drives'] > 1000
          assert scoring['market_blind'] is True
          assert scoring['behavior_changed_by_audit'] is False
          assert clock['market_blind'] is True
          assert clock['behavior_changed_by_audit'] is False
          print(json.dumps({'stage3': comparison, 'drive_survival': survival, 'scoring_state': scoring, 'clock': clock}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v1-3-stage3-paired
          path: artifacts/stage3-paired/
          retention-days: 14
