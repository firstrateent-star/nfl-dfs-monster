name: Monster Football Reality v1.1 current player value

on:
  push:
    branches: [feature/slate-simulator-v1]
    paths:
      - scripts/run_week1_reality_fantasy_complete.py
      - scripts/run_week1_reality_v1.py
      - src/monster/feature_compile/environment.py
      - src/monster/sim/event_coupling.py
      - src/monster/sim/pipeline_v11.py
      - tests/test_environment_propagation.py
      - tests/test_event_coupling.py
      - .github/workflows/reality-v1-current-value.yml
  workflow_dispatch:

jobs:
  current-value:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/slate-simulator-v1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Production and Full-Reality mechanism gates
        run: |
          uv run ruff check src tests scripts/run_week1_reality_fantasy_complete.py scripts/run_week1_reality_v1.py
          uv run pytest -q
          uv run pytest -q tests/test_full_reality_counterfactuals.py tests/test_environment_propagation.py tests/test_event_coupling.py
      - name: Build current 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline
      - name: Audit Full-Reality source coverage
        run: >-
          uv run python scripts/audit_full_reality_features.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --out artifacts/full-reality-audit
      - name: Build market-blind football priors
        run: |
          uv run python scripts/build_league_policy.py --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py --history 2024 --out artifacts/league-policy-2024
      - name: Build current Week 1 health snapshot
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026 --out artifacts/week1-health
      - name: Compile continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --out artifacts/continuity-policy
      - name: Run 20K Monster v1.1 event-coupled fantasy-complete worlds
        run: >-
          uv run python scripts/run_week1_reality_fantasy_complete.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --ol-outcomes artifacts/league-policy/offensive_line_outcomes.parquet
          --worlds 20000 --seed 2026090907
          --interception-fraction 0.5922258892555923
          --out artifacts/current-reality-value
      - name: Verify current-state manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/current-reality-value/manifest.json').read_text())
          assert m['market_blind_football'] is True
          assert m['dfs_layer_downstream_only'] is True
          assert m['turnover_conservation_failures'] == 0
          assert m['defense_rows'] == 24
          assert m['worlds_per_game'] == 20000
          print(json.dumps(m, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-football-reality-v1-1-event-coupled-20k
          path: |
            artifacts/current-reality-value/
            artifacts/full-reality-audit/
          retention-days: 14
