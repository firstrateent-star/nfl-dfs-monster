name: Monster hierarchical game-flow brain OOS audit

on:
  push:
    branches: [feature/football-state-v13-clock]
    paths:
      - scripts/audit_game_flow_brain_oos.py
      - src/monster/feature_compile/game_flow_policy.py
      - src/monster/sim/game_flow.py
      - src/monster/sim/game_flow_brain.py
      - src/monster/sim/game_flow_lookup.py
      - .github/workflows/game-flow-brain-oos.yml
  workflow_dispatch:

jobs:
  game-flow-oos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Code guards
        run: |
          uv run ruff check src tests scripts/audit_game_flow_brain_oos.py
          uv run pytest -q
      - name: Audit hierarchical game-flow brain out of sample
        run: >-
          uv run python scripts/audit_game_flow_brain_oos.py
          --out artifacts/game-flow-brain-oos
      - name: Verify observational OOS audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('artifacts/game-flow-brain-oos/manifest.json').read_text())
          assert m['market_blind'] is True
          assert m['behavior_changed_by_audit'] is False
          assert len(m['folds']) == 2
          print(json.dumps(m, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-game-flow-brain-oos
          path: artifacts/game-flow-brain-oos/
          retention-days: 14
