  dome_flag:
    entity_scopes: [environment, game]
    interaction_scales: [game_state]
    phases: [pre_snap]
    mechanisms: [environment_context]

  # Experimental / audit-only evidence
  natal_sun_longitude:
    entity_scopes: [player]
    interaction_scales: [game_state]
    phases: [pre_snap]
    mechanisms: [experimental_shadow]
    audit_only: true
  game_transit_residual_score:
    entity_scopes: [player, game]
    interaction_scales: [game_state]
    phases: [pre_snap]
