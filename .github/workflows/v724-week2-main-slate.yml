name: v7.2.4 Week 2 Collapse Consequence Calibration

on:
  push:
    branches: [work/v724-collapse-consequence-calibration]
    paths:
      - benchmarks/v724_week2_main_launch.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v724-week2-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Lint V7.2.4
        run: >-
          uv run ruff check
          scripts/runtime_v724_composer.py
          scripts/run_reality_loop_v724.py
          scripts/run_week2_v724_main_slate.py
          src/monster/reality/failure_paths_v724.py
          tests/test_v724_collapse_consequence.py

      - name: Require V7.2.4 and inherited causal gates
        run: >-
          uv run pytest -q
          tests/test_v724_collapse_consequence.py
          tests/test_v723_failure_calibration.py
          tests/test_v722_failure_paths.py
          tests/test_v722_world_availability.py
          tests/test_v721_game_script.py
          tests/test_v72_reality_engine.py
          tests/test_v701_runtime.py
          tests/test_market_blind_guard.py

      - name: Build Saturday live Week 2 personnel
        run: >-
          uv run python scripts/build_week2_2026_live_pregame.py
          --season 2026
          --history 2025
          --recent-games 6
          --out artifacts/week2-live-pregame

      - name: Build Week 1-only Week 2 policy
        run: >-
          uv run python scripts/build_week2_2026_policy.py
          --prior-seasons 2025
          --current-season 2026
          --through-week 1
          --out artifacts/week2-live-policy

      - name: Build older continuity policy
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2024
          --out artifacts/league-policy-2024

      - name: Build Saturday health state
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/week2-live-pregame/league_personnel.parquet
          --injuries artifacts/week2-live-pregame/raw_injuries.parquet
          --overrides config/health/week2_2026_live_2026-09-19.csv
          --season 2026
          --out artifacts/week2-live-health

      - name: Build continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/week2-live-policy/team_policy.parquet
          --personnel artifacts/week2-live-health/health_personnel.parquet
          --out artifacts/week2-live-continuity-policy

      - name: Run V7.2.4 Week 2 consequence worlds
        run: >-
          uv run python scripts/run_week2_v724_main_slate.py
          --policy artifacts/week2-live-continuity-policy/team_policy.parquet
          --personnel artifacts/week2-live-health/health_personnel.parquet
          --player-usage artifacts/week2-live-policy/player_usage.parquet
          --situation-context artifacts/week2-live-policy/situational_pass_context.parquet
          --worlds 120
          --seed 2026092022
          --progress-every 120
          --first-out artifacts/week2-v724-main
          --box-out artifacts/week2-v724-main-box

      - name: Require V7.2.4 runtime fingerprint
        run: |
          test -f artifacts/week2-v724-main/runtime_fingerprint_v724.json
          uv run python - <<'PY'
          import json
          p = json.load(open("artifacts/week2-v724-main/runtime_fingerprint_v724.json"))
          assert p["left_tail_mass_unchanged_from_v723"] is True
          assert p["mode_gated_drive_consequence_active"] is True
          assert p["normal_world_finishing_protected"] is True
          assert p["hard_collapse_finishing_amplified"] is True
          assert p["scoring_event_authority_preserved"] is True
          assert p["tightened_qb_benching_preserved"] is True
          assert p["market_inputs_to_football"] is False
          assert p["direct_score_adjustment"] is False
          print(p)
          PY

      - name: Upload V7.2.4 Week 2 worlds
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v724-week2-consequence-worlds-${{ github.run_id }}
          path: |
            artifacts/week2-v724-main/
            artifacts/week2-v724-main-box/
            artifacts/week2-live-health/
            config/health/week2_2026_live_2026-09-19.csv
          retention-days: 30
