name: v7.1 Strict Week 1 One World Reality Audit

on:
  push:
    branches: [work/v7-reality-engine]
    paths:
      - benchmarks/v701_week1_strict_one_world_launch.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v701-week1-strict-one-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate-and-freeze-truth:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --extra dev

      - name: Require current v7.1 causal gates
        run: >-
          uv run pytest -q
          tests/test_v701_runtime.py
          tests/test_v7_qb_rush_authority.py
          tests/test_v7_qb_rush_families.py
          tests/test_v7_participation_opportunity.py
          tests/test_event_ledger.py
          tests/test_market_blind_guard.py

      - name: Build strict pre-Week-1 personnel snapshot
        run: >-
          uv run python scripts/build_week1_2026_pregame_strict.py
          --season 2026
          --history 2025
          --recent-games 6
          --out artifacts/week1-strict-pregame-baseline

      - name: Build pre-Week-1 football policy
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2025
          --out artifacts/week1-policy

      - name: Build older policy for continuity conditioning
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2024
          --out artifacts/league-policy-2024

      - name: Apply only pre-opener health knowledge
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/week1-strict-pregame-baseline/league_personnel.parquet
          --injuries artifacts/week1-strict-pregame-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026
          --out artifacts/week1-strict-health

      - name: Build continuity-conditioned Week 1 team policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/week1-policy/team_policy.parquet
          --personnel artifacts/week1-strict-health/health_personnel.parquet
          --out artifacts/week1-strict-continuity-policy

      - name: Run exactly one current v7.1 world for all 16 Week 1 games
        run: >-
          uv run python scripts/run_week1_v701_one_world.py
          --policy artifacts/week1-strict-continuity-policy/team_policy.parquet
          --personnel artifacts/week1-strict-health/health_personnel.parquet
          --player-usage artifacts/week1-policy/player_usage.parquet
          --situation-context artifacts/week1-policy/situational_pass_context.parquet
          --worlds 1
          --seed 2026091901
          --progress-every 1
          --first-out artifacts/week1-v701-one-world
          --box-out artifacts/week1-v701-one-world-box

      - name: Audit simulated QB rushing families before truth
        run: >-
          uv run python scripts/audit_simulated_qb_rush_families_v7.py
          --simulation artifacts/week1-v701-one-world
          --out artifacts/week1-v701-qb-rush

      - name: Freeze actual Week 1 truth only after simulation completes
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import nflreadpy as nfl
          import polars as pl

          out = Path("artifacts/week1-actual-truth")
          out.mkdir(parents=True, exist_ok=True)

          def filt_week1(frame: pl.DataFrame) -> pl.DataFrame:
              if "season" in frame.columns:
                  frame = frame.filter(pl.col("season").cast(pl.Int64, strict=False) == 2026)
              if "week" in frame.columns:
                  frame = frame.filter(pl.col("week").cast(pl.Int64, strict=False) == 1)
              if "season_type" in frame.columns:
                  frame = frame.filter(
                      pl.col("season_type").cast(pl.Utf8).str.to_uppercase() == "REG"
                  )
              return frame

          player = filt_week1(nfl.load_player_stats([2026]))
          snaps = filt_week1(nfl.load_snap_counts([2026]))
          pbp = filt_week1(nfl.load_pbp([2026]))
          schedules = filt_week1(nfl.load_schedules([2026]))
          try:
              defense = filt_week1(
                  nfl.load_pfr_advstats([2026], stat_type="def", summary_level="week")
              )
          except Exception as exc:
              defense = pl.DataFrame({"truth_load_error": [str(exc)]})

          player.write_csv(out / "player_stats_week1.csv")
          snaps.write_csv(out / "snap_counts_week1.csv")
          pbp.write_parquet(out / "pbp_week1.parquet", compression="zstd")
          schedules.write_csv(out / "schedules_week1.csv")
          defense.write_csv(out / "pfr_defense_week1.csv")

          schema = {
              "truth_loaded_after_simulation": True,
              "season": 2026,
              "week": 1,
              "player_stats_columns": player.columns,
              "snap_count_columns": snaps.columns,
              "pbp_columns": pbp.columns,
              "schedule_columns": schedules.columns,
              "pfr_defense_columns": defense.columns,
              "player_rows": player.height,
              "snap_rows": snaps.height,
              "pbp_rows": pbp.height,
              "schedule_rows": schedules.height,
              "pfr_defense_rows": defense.height,
          }
          (out / "truth_schema.json").write_text(json.dumps(schema, indent=2) + "\n")
          print(json.dumps(schema, indent=2))
          PY

      - name: Preserve audit provenance
        run: |
          cat > artifacts/week1-v701-one-world/provenance_week1_strict.json <<'EOF'
          {
            "experiment": "MONSTER v7.1 strict Week 1 one-world reality audit",
            "worlds_per_game": 1,
            "games": 16,
            "seed": 2026091901,
            "input_cutoff": "2026-09-08",
            "first_game": "2026-09-09",
            "current_2026_regular_season_snaps_used": false,
            "week1_truth_consumed_before_simulation": false,
            "market_blind": true,
            "truth_phase": "executed only after simulation"
          }
          EOF

      - name: Upload complete Week 1 reality audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v701-week1-strict-one-world-${{ github.run_id }}
          path: |
            benchmarks/week1_2026_all_games.csv
            artifacts/week1-strict-pregame-baseline/manifest.json
            artifacts/week1-strict-health/
            artifacts/week1-policy/manifest.json
            artifacts/week1-strict-continuity-policy/
            artifacts/week1-v701-one-world/
            artifacts/week1-v701-one-world-box/
            artifacts/week1-v701-qb-rush/
            artifacts/week1-actual-truth/
          retention-days: 30
