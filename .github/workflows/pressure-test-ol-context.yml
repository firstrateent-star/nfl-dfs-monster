name: Pressure test OL simulation context
on:
  workflow_dispatch:
  push:
    branches:
      - feature/slate-simulator-v1
    paths:
      - 'src/monster/feature_compile/ol_simulation.py'
      - 'src/monster/sim/game.py'
      - 'src/monster/sim/league.py'
      - 'src/monster/snapshot/model.py'
      - 'scripts/pressure_test_ol_context.py'
      - '.github/workflows/pressure-test-ol-context.yml'
permissions:
  contents: read
jobs:
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build current 32-team personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026
          --history 2025
          --recent-games 6
          --out artifacts/league-baseline
      - name: Build historical team policy and OL audit outcomes
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2025
          --out artifacts/league-policy
      - name: Run matched-seed OL A/B pressure test
        run: >-
          uv run python scripts/pressure_test_ol_context.py
          --policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/league-baseline/league_personnel.parquet
          --ol-outcomes artifacts/league-policy/offensive_line_outcomes.parquet
          --worlds 5000
          --seed 2026090703
          --out artifacts/ol-pressure-test
      - name: Show pressure-test results
        run: |
          cat artifacts/ol-pressure-test/ol_pressure_test.csv
          cat artifacts/ol-pressure-test/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: monster-ol-context-pressure-test
          path: artifacts/ol-pressure-test/
          retention-days: 7
          compression-level: 6
