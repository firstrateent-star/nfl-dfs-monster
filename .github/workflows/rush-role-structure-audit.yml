name: Rush role structure audit

on:
  push:
    branches:
      - feature/slate-simulator-v1
    paths:
      - scripts/audit_rush_role_structure.py
      - .github/workflows/rush-role-structure-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Audit 2025 rushing role structure
        run: >-
          uv run python scripts/audit_rush_role_structure.py
          --history 2025 --out artifacts/rush-role-structure
      - name: Show result
        run: |
          cat artifacts/rush-role-structure/rush_structure_by_rank.csv
          cat artifacts/rush-role-structure/rush_structure_by_position.csv
          cat artifacts/rush-role-structure/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-rush-role-structure
          path: artifacts/rush-role-structure/
          retention-days: 7
