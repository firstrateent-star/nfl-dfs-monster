name: Monster v1.3 first Week 1 event simulation

on:
  push:
    branches: [feature/football-state-v13-clock]
    paths:
      - scripts/run_week1_v13_first_sim.py
      - scripts/run_week1_v13_box_scores.py
      - scripts/run_week1_v13_complete_box_scores.py
      - scripts/build_week1_v13_consensus_box_score.py
      - scripts/build_league_baseline.py
      - scripts/build_league_policy.py
      - src/monster/ingest/**
      - src/monster/sim/**
      - src/monster/feature_compile/**
      - tests/test_defensive_attribution.py
      - .github/workflows/v13-first-simulation.yml
  workflow_dispatch:

jobs:
  first-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Causal architecture gates
        run: |
          uv run ruff check src tests scripts/run_week1_v13_first_sim.py scripts/run_week1_v13_box_scores.py scripts/run_week1_v13_complete_box_scores.py scripts/build_week1_v13_consensus_box_score.py scripts/build_league_baseline.py scripts/build_league_policy.py
          uv run pytest -q
      - name: Build current 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline
      - name: Build market-blind priors
        run: |
          uv run python scripts/build_league_policy.py --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py --history 2024 --out artifacts/league-policy-2024
      - name: Build current Week 1 health snapshot
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026 --out artifacts/week1-health
      - name: Compile continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --out artifacts/continuity-policy
      - name: Run first v1.3 event-by-event Week 1 simulation
        run: >-
          uv run python scripts/run_week1_v13_first_sim.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 1000 --seed 2026190921
          --out artifacts/week1-v13-first-sim
      - name: Generate simulated offensive and defensive game box scores
        run: >-
          uv run python scripts/run_week1_v13_box_scores.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 1000 --seed 2026110911
          --out artifacts/week1-v13-box-scores
      - name: Generate complete participant box scores
        run: >-
          uv run python scripts/run_week1_v13_complete_box_scores.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 1000 --seed 2026110912
          --out artifacts/week1-v13-complete-box-scores
      - name: Build singular consensus projected box score
        run: >-
          uv run python scripts/build_week1_v13_consensus_box_score.py
          --players artifacts/week1-v13-complete-box-scores/complete_player_box_score_distributions.csv
          --teams artifacts/week1-v13-box-scores/team_box_score_distributions.csv
          --source-manifest artifacts/week1-v13-complete-box-scores/manifest.json
          --out artifacts/week1-v13-consensus-box-score
      - name: Verify shadow manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline=json.loads(Path('artifacts/league-baseline/manifest.json').read_text())
          assert baseline['madden_player_ratings_loaded'] is True
          assert baseline['madden_source'] != 'unavailable'
          assert baseline['madden_source_player_rows'] >= 2000
          assert baseline['madden_snapshot_attribute_columns'] >= 40
          assert baseline['players_with_full_madden_match'] > 1000
          m=json.loads(Path('artifacts/week1-v13-first-sim/manifest.json').read_text())
          assert m['market_blind_football'] is True
          assert m['scoreboard_event_derived'] is True
          assert m['player_stats_event_derived'] is True
          assert m['definition_safe_anatomy'] is True
          assert m['empirical_situational_pass_context_active'] is True
          assert m['complete_game_simulation_active'] is True
          assert m['regular_season_overtime_active'] is True
          assert m['overtime_rule_version'] == '2026_rule_16_regular_season_10min_both_possessions'
          assert m['game_distribution_standard_deviations_active'] is True
          assert m['games'] == 12
          assert m['worlds_per_game'] == 1000
          assert m['seed'] == 2026190921
          b=json.loads(Path('artifacts/week1-v13-box-scores/manifest.json').read_text())
          assert b['market_blind_football'] is True
          assert b['dfs_inputs_used'] is False
          assert b['sportsbook_inputs_used'] is False
          assert b['offense_event_derived'] is True
          assert b['defense_event_derived'] is True
          assert b['games'] == 12
          assert b['worlds_per_game'] == 1000
          c=json.loads(Path('artifacts/week1-v13-complete-box-scores/manifest.json').read_text())
          assert c['market_blind_football'] is True
          assert c['dfs_inputs_used'] is False
          assert c['sportsbook_inputs_used'] is False
          assert c['role_aware_defensive_attribution'] is True
          assert c['all_projected_unit_players_emitted'] is True
          assert c['representative_world_only_includes_simulated_participants'] is True
          assert c['games'] == 12
          assert c['worlds_per_game'] == 1000
          assert c['defensive_sanity']['max_mean_tackles'] < 20.0
          assert c['defensive_sanity']['max_mean_pressures'] < 12.0
          assert c['defensive_sanity']['max_mean_sacks'] < 4.0
          consensus=json.loads(Path('artifacts/week1-v13-consensus-box-score/manifest.json').read_text())
          assert consensus['market_blind_football'] is True
          assert consensus['dfs_inputs_used'] is False
          assert consensus['sportsbook_inputs_used'] is False
          assert consensus['games'] == 12
          assert consensus['worlds_per_game'] == 1000
          assert consensus['player_rows'] > 0
          assert consensus['team_rows'] == 24
          print(json.dumps(baseline, indent=2))
          print(json.dumps(consensus, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v1-3-week1-first-event-simulation
          path: |
            artifacts/league-baseline/manifest.json
            artifacts/league-baseline/raw_madden27_player_ratings.parquet
            artifacts/week1-v13-first-sim/
            artifacts/week1-v13-box-scores/
            artifacts/week1-v13-complete-box-scores/
            artifacts/week1-v13-consensus-box-score/
          retention-days: 14
