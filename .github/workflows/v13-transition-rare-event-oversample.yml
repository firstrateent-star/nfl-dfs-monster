name: Monster v1.3 MON-LEDGER-002C.3 rare event oversample

on:
  workflow_dispatch:
  push:
    branches: [feature/football-state-v13-clock]
    paths:
      - scripts/audit_transition_rare_event_oversample.py
      - .github/workflows/v13-transition-rare-event-oversample.yml

jobs:
  rare-event-oversample:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Vlourish structural gates
        run: |
          uv run ruff check scripts/audit_transition_rare_event_oversample.py --ignore RUF046,I001,SIM114
          uv run pytest -q tests/test_state_transition_eval.py

      - name: Build current 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline

      - name: Build market-blind priors
        run: |
          uv run python scripts/build_league_policy.py --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py --history 2024 --out artifacts/league-policy-2024

      - name: Build current Week 1 health snapshot
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-07.csv
          --season 2026 --out artifacts/week1-health

      - name: Compile continuity-conditioned policy
        run: >-
          uv run python scripts/build_continuity_conditioned_policy.py
          --older-policy artifacts/league-policy-2024/team_policy.parquet
          --latest-policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --out artifacts/continuity-policy

      - name: Rebuild matched state mirror
        run: >-
          uv run python scripts/audit_state_transition_mirror.py
          --season 2025
          --cache-dir .cache/monster
          --game-flow-league artifacts/league-policy/game_flow_league.parquet
          --game-flow-team artifacts/league-policy/game_flow_team.parquet
          --pass-depth-league artifacts/league-policy/pass_depth_league.parquet
          --pass-depth-team artifacts/league-policy/pass_depth_team.parquet
          --pass-depth-qb artifacts/league-policy/pass_depth_qb.parquet
          --pass-depth-outcomes artifacts/league-policy/pass_depth_outcomes.parquet
          --target-depth artifacts/league-policy/target_depth.parquet
          --run-geometry-league artifacts/league-policy/run_geometry_league.parquet
          --run-geometry-team artifacts/league-policy/run_geometry_team.parquet
          --run-geometry-rusher artifacts/league-policy/run_geometry_rusher.parquet
          --run-geometry-outcomes artifacts/league-policy/run_geometry_outcomes.parquet
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --max-historical-states 12000
          --replicates 1
          --seed 2026091202
          --out artifacts/state-transition-mirror

      - name: Run rare-event oversample
        run: >-
          uv run python scripts/audit_transition_rare_event_oversample.py
          --historical artifacts/state-transition-mirror/historical_transition_rows.parquet
          --baseline-monster artifacts/state-transition-mirror/monster_transition_rows.parquet
          --game-flow-league artifacts/league-policy/game_flow_league.parquet
          --game-flow-team artifacts/league-policy/game_flow_team.parquet
          --pass-depth-league artifacts/league-policy/pass_depth_league.parquet
          --pass-depth-team artifacts/league-policy/pass_depth_team.parquet
          --pass-depth-qb artifacts/league-policy/pass_depth_qb.parquet
          --pass-depth-outcomes artifacts/league-policy/pass_depth_outcomes.parquet
          --target-depth artifacts/league-policy/target_depth.parquet
          --run-geometry-league artifacts/league-policy/run_geometry_league.parquet
          --run-geometry-team artifacts/league-policy/run_geometry_team.parquet
          --run-geometry-rusher artifacts/league-policy/run_geometry_rusher.parquet
          --run-geometry-outcomes artifacts/league-policy/run_geometry_outcomes.parquet
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --sample-per-state 2500
          --replicates 16
          --seed 2026091203
          --out artifacts/transition-rare-event-oversample

      - name: Verify Vlourish rare-event contract
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          import polars as pl

          root=Path('artifacts/transition-rare-event-oversample')
          m=json.loads((root/'manifest.json').read_text())
          ledger=json.loads((root/'methodology_ledger.json').read_text())
          evidence=pl.read_csv(root/'rare_event_evidence.csv')
          cf=pl.read_csv(root/'rare_event_counterfactuals.csv')
          assert m['experiment']=='MON-LEDGER-002C.3-RARE-EVENT-OVERSAMPLE'
          assert m['market_blind'] is True
          assert m['behavior_changed_by_audit'] is False
          assert m['production_authority'] is False
          assert m['monster_oversample_rows'] >= 70000
          assert ledger['governance']['stage']=='LAB'
          assert ledger['governance']['football_coefficients_changed'] is False
          assert ledger['governance']['production_behavior_changed'] is False
          assert ledger['governance']['full_game_simulation_required'] is False
          assert evidence.height == 4
          assert evidence.filter(pl.col('evidence_sufficient')).height >= 2
          assert cf.height >= 3
          print(evidence)
          print(cf)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v1-3-vlourish-transition-rare-event-oversample
          path: |
            artifacts/state-transition-mirror/
            artifacts/transition-rare-event-oversample/
          retention-days: 14
