name: DEN-KC v6.3 small test

on:
  push:
    branches: [work/reality-loop-v2-test]
    paths:
      - .github/workflows/den-kc-v63-small-test.yml
      - scripts/run_single_game_v63.py
      - config/health/week1_2026_2026-09-14_den_kc.csv
      - src/monster/ingest/nflverse.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Build fresh 2026 personnel baseline
        run: >-
          uv run python scripts/build_league_baseline.py
          --season 2026 --history 2025 --recent-games 6
          --out artifacts/league-baseline

      - name: Build market-blind 2025 football priors
        run: >-
          uv run python scripts/build_league_policy.py
          --history 2025
          --out artifacts/league-policy

      - name: Build kickoff-health snapshot for DEN-KC
        run: >-
          uv run python scripts/build_health_snapshot.py
          --personnel artifacts/league-baseline/league_personnel.parquet
          --injuries artifacts/league-baseline/raw_injuries.parquet
          --overrides config/health/week1_2026_2026-09-14_den_kc.csv
          --season 2026
          --out artifacts/den-kc-health

      - name: Run protected v6.3 DEN at KC 100-world test
        run: >-
          uv run python scripts/run_single_game_v63.py
          --policy artifacts/league-policy/team_policy.parquet
          --personnel artifacts/den-kc-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds 100
          --seed 2026091401
          --first-out artifacts/den-kc-v63
          --box-out artifacts/den-kc-v63-box
          --progress-every 25

      - name: Print core outputs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import polars as pl

          root=Path('artifacts/den-kc-v63')
          print('\n--- PROJECTED SCORE + OUTCOME ---')
          path=root/'projected_scores_and_outcomes.csv'
          if path.exists(): print(pl.read_csv(path))

          print('\n--- FOOTBALL ANATOMY ---')
          path=root/'football_anatomy.csv'
          if path.exists(): print(pl.read_csv(path))

          print('\n--- TOP PLAYER DISTRIBUTIONS ---')
          path=root/'player_distributions.csv'
          if path.exists():
              p=pl.read_csv(path)
              cols=[c for c in ['player','position','fanduel_mean','fanduel_p50','fanduel_p90','fanduel_p95','pass_attempts_mean','passing_yards_mean','passing_tds_mean','interceptions_mean','rush_attempts_mean','rushing_yards_mean','rushing_tds_mean','targets_mean','receptions_mean','receiving_yards_mean','receiving_tds_mean'] if c in p.columns]
              print(p.select(cols).sort('fanduel_mean', descending=True).head(30))

          print('\n--- TARGET ROLE WORLDS ---')
          path=root/'target_role_plan_audit_v63.csv'
          if path.exists():
              r=pl.read_csv(path)
              cols=[c for c in ['team','player','position','base_target_share','active_probability','role_uncertainty','target_plan_share_mean','target_plan_share_p50','target_plan_share_p90','target_plan_participation_probability'] if c in r.columns]
              print(r.filter(pl.col('team').is_in(['DEN','KC'])).select(cols).sort(['team','target_plan_share_mean'],descending=[False,True]))

          print('\n--- RUSHING ROLE WORLDS ---')
          path=root/'rushing_role_plan_audit.csv'
          if path.exists():
              r=pl.read_csv(path)
              cols=[c for c in ['team','player','position','base_rush_share','rush_role_probability','active_probability','role_uncertainty','plan_share_mean','plan_share_p50','plan_share_p90','plan_participation_probability'] if c in r.columns]
              print(r.filter(pl.col('team').is_in(['DEN','KC'])).select(cols).sort(['team','plan_share_mean'],descending=[False,True]))

          print('\n--- TEAM BOX DISTRIBUTIONS ---')
          path=Path('artifacts/den-kc-v63-box/team_box_score_distributions.csv')
          if path.exists(): print(pl.read_csv(path))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: den-kc-v63-small-test-${{ github.run_id }}
          path: |
            artifacts/den-kc-v63/
            artifacts/den-kc-v63-box/
            artifacts/den-kc-health/manifest.json
            artifacts/league-baseline/manifest.json
            artifacts/league-policy/manifest.json
          retention-days: 14
