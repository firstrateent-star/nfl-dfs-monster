    mechanisms: [red_zone_conversion, drive_calibration]
  defensive_td_drive_rate_allowed:
    entity_scopes: [team]
    interaction_scales: [game_state]
    phases: [post_play]
    mechanisms: [drive_calibration]
  defensive_fg_drive_rate_allowed:
    entity_scopes: [team]
    interaction_scales: [game_state]
    phases: [post_play]
    mechanisms: [drive_calibration]
  defensive_takeaway_drive_rate:
    entity_scopes: [team]
    interaction_scales: [game_state]
    phases: [post_play]
    mechanisms: [drive_calibration]
  defensive_explosive_rate_allowed:
    entity_scopes: [team]
    interaction_scales: [11v11]
    phases: [development, resolution]
    mechanisms: [explosive_prevention, drive_progress]
  defensive_sack_rate:
    entity_scopes: [team, unit]
    interaction_scales: [unit, 11v11]
