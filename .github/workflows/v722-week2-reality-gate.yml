name: v7.2.2 Week 2 Reality Gate

on:
  push:
    branches: [work/v722-week2-reality]
    paths:
      - src/monster/reality/failure_paths_v722.py
      - src/monster/reality/world_availability_v722.py
      - src/monster/dfs/portfolio.py
      - scripts/runtime_v722_composer.py
      - scripts/run_reality_loop_v722.py
      - scripts/build_failure_path_portfolio.py
      - tests/test_v722_failure_paths.py
      - tests/test_v722_world_availability.py
      - tests/test_failure_path_portfolio.py
      - .github/workflows/v722-week2-reality-gate.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v722-week2-reality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Lint V7.2.2 reality patch
        run: >-
          uv run ruff check
          src/monster/reality/failure_paths_v722.py
          src/monster/reality/world_availability_v722.py
          src/monster/dfs/portfolio.py
          scripts/runtime_v722_composer.py
          scripts/run_reality_loop_v722.py
          scripts/build_failure_path_portfolio.py
          tests/test_v722_failure_paths.py
          tests/test_v722_world_availability.py
          tests/test_failure_path_portfolio.py

      - name: Run V7.2.2 and inherited reality tests
        run: >-
          uv run pytest -q
          tests/test_v722_failure_paths.py
          tests/test_v722_world_availability.py
          tests/test_failure_path_portfolio.py
          tests/test_v721_game_script.py
          tests/test_v72_reality_engine.py
          tests/test_market_blind_guard.py
