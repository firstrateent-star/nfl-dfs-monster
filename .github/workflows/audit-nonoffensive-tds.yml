name: Audit non-offensive TD channels

on:
  push:
    branches: [work/reality-loop-v2-test]
    paths:
      - scripts/audit_historical_nonoffensive_td_channels.py
      - scripts/audit_return_field_semantics.py
      - scripts/audit_historical_drive_starts.py
      - .github/workflows/audit-nonoffensive-tds.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Audit 2025 non-offensive touchdown channels
        run: >-
          uv run python scripts/audit_historical_nonoffensive_td_channels.py
          --season 2025
          --out artifacts/nonoffensive-td-audit.json
      - name: Audit raw return field semantics
        run: >-
          uv run python scripts/audit_return_field_semantics.py
          --season 2025
          --out artifacts/return-field-semantics.json
      - name: Audit historical drive starts
        run: >-
          uv run python scripts/audit_historical_drive_starts.py
          --seasons 2024 2025
      - uses: actions/upload-artifact@v4
        with:
          name: monster-nonoffensive-td-audit-${{ github.run_id }}
          path: |
            artifacts/nonoffensive-td-audit.json
            artifacts/return-field-semantics.json
          retention-days: 14
