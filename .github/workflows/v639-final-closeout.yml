name: v6.3.9 Final Paired Week 1 Closeout

on:
  push:
    branches: [work/v639-gadget-entry-calibration]
    paths:
      - benchmarks/v639_closeout_launch_marker.txt
  workflow_dispatch:
    inputs:
      worlds:
        description: Worlds per game for each paired arm
        required: true
        default: '300'
      seed:
        description: Shared deterministic seed
        required: true
        default: '2026091701'

permissions:
  contents: read
  actions: read

concurrency:
  group: v639-final-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Run v6.3.9 and inherited causal gates
        run: >-
          uv run pytest -q
          tests/test_gadget_rush_calibration_v639.py
          tests/test_gadget_rush_decomposition_v638.py
          tests/test_role_allocation_v636.py
          tests/test_identity_propagation_role_v635.py
          tests/test_matchup_identity_authority_v634.py
          tests/test_current_role_guard_v63.py
          tests/test_player_duel_authority_v6.py
          tests/test_reality_loop_v2_identity_authority.py
      - name: Lint v6.3.9 closeout files
        run: >-
          uv run ruff check
          src/monster/sim/gadget_rush_entry_priors_v639.py
          src/monster/sim/current_role_guard_v639.py
          scripts/runtime_v639_composer.py
          scripts/run_reality_loop_v639.py
          scripts/audit_full_game_counterfactual_v639.py
          scripts/audit_coaching_policy_identity_v639.py
          scripts/compare_week1_v638_v639.py
          tests/test_gadget_rush_calibration_v639.py
          --ignore RUF046

  paired-week1:
    needs: code-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CONTROL_SHA: 374988076b0a443c1b6eaa368e7641439f078b21
      WORLDS: ${{ github.event.inputs.worlds || '300' }}
      SEED: ${{ github.event.inputs.seed || '2026091701' }}
    steps:
      - name: Checkout v6.3.9 challenger
        uses: actions/checkout@v4
        with:
          path: challenger

      - name: Checkout permanent Week 1 benchmark
        uses: actions/checkout@v4
        with:
          ref: work/week1-reality-benchmark-v1
          path: benchmark

      - name: Checkout frozen v6.3.8 control
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_SHA }}
          path: control

      - uses: astral-sh/setup-uv@v6

      - name: Install control dependencies
        working-directory: control
        run: uv sync --extra dev

      - name: Install challenger dependencies
        working-directory: challenger
        run: uv sync --extra dev

      - name: Build one shared leakage-resistant Week 1 input world
        working-directory: control
        run: |
          uv run python ../benchmark/scripts/build_week1_2026_pregame_baseline.py \
            --season 2026 --history 2025 --recent-games 6 \
            --out artifacts/week1-pregame-baseline
          uv run python scripts/build_league_policy.py \
            --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py \
            --history 2024 --out artifacts/league-policy-2024
          uv run python scripts/build_health_snapshot.py \
            --personnel artifacts/week1-pregame-baseline/league_personnel.parquet \
            --injuries artifacts/week1-pregame-baseline/raw_injuries.parquet \
            --overrides config/health/week1_2026_2026-09-07.csv \
            --season 2026 --out artifacts/week1-health
          uv run python scripts/build_continuity_conditioned_policy.py \
            --older-policy artifacts/league-policy-2024/team_policy.parquet \
            --latest-policy artifacts/league-policy/team_policy.parquet \
            --personnel artifacts/week1-health/health_personnel.parquet \
            --out artifacts/continuity-policy

      - name: Audit coaching differentiation through v6.3.9 runtime
        working-directory: challenger
        run: >-
          uv run python scripts/audit_coaching_policy_identity_v639.py
          --policy ../control/artifacts/continuity-policy/team_policy.parquet
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --player-usage ../control/artifacts/league-policy/player_usage.parquet
          --situation-context ../control/artifacts/league-policy/situational_pass_context.parquet
          --out ../benchmark/artifacts/v639-coaching-policy

      - name: Run common-seed QB propagation counterfactual through v6.3.9 runtime
        working-directory: challenger
        run: >-
          uv run python scripts/audit_full_game_counterfactual_v639.py
          --policy ../control/artifacts/continuity-policy/team_policy.parquet
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --player-usage ../control/artifacts/league-policy/player_usage.parquet
          --situation-context ../control/artifacts/league-policy/situational_pass_context.parquet
          --worlds 40
          --seed 6391702
          --out ../benchmark/artifacts/v639-counterfactual

      - name: Require hierarchical QB identity propagation
        working-directory: benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("artifacts/v639-counterfactual/v639_full_game_qb_counterfactual.json").read_text()
          )
          gates = report["hierarchical_gate"]
          if not gates["overall"]:
              raise SystemExit(
                  f"QB causal propagation gate failed under v6.3.9: {gates}; "
                  f"metrics={report['metrics']}"
              )
          PY

      - name: Run frozen v6.3.8 control
        working-directory: control
        run: >-
          uv run python scripts/run_reality_loop_v638.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds "$WORLDS"
          --seed "$SEED"
          --progress-every 100
          --first-out artifacts/v638-control
          --box-out artifacts/v638-control-box

      - name: Run v6.3.9 challenger on identical inputs and seed
        working-directory: challenger
        run: >-
          uv run python scripts/run_reality_loop_v639.py
          --policy ../control/artifacts/continuity-policy/team_policy.parquet
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --player-usage ../control/artifacts/league-policy/player_usage.parquet
          --situation-context ../control/artifacts/league-policy/situational_pass_context.parquet
          --worlds "$WORLDS"
          --seed "$SEED"
          --progress-every 100
          --first-out artifacts/v639-challenger
          --box-out artifacts/v639-challenger-box

      - name: Audit role translation and score anatomy
        run: |
          cd control
          uv run python scripts/audit_role_snap_opportunity_v63.py \
            --simulation artifacts/v638-control
          uv run python scripts/audit_reality_loop_v2_score_anatomy.py \
            --simulation artifacts/v638-control --history 2025 \
            --out artifacts/v638-control
          cd ../challenger
          uv run python scripts/audit_role_snap_opportunity_v63.py \
            --simulation artifacts/v639-challenger
          uv run python scripts/audit_reality_loop_v2_score_anatomy.py \
            --simulation artifacts/v639-challenger --history 2025 \
            --out artifacts/v639-challenger

      - name: Audit full-world identity propagation in both arms
        run: |
          challenger/.venv/bin/python challenger/scripts/audit_identity_propagation_v634.py \
            --simulation control/artifacts/v638-control \
            --out benchmark/artifacts/v638-control-propagation
          challenger/.venv/bin/python challenger/scripts/audit_identity_propagation_v634.py \
            --simulation challenger/artifacts/v639-challenger \
            --out benchmark/artifacts/v639-propagation

      - name: Download finalized Week 1 truth after simulations
        working-directory: benchmark
        run: |
          mkdir -p artifacts
          curl --fail --location --retry 3 \
            --output artifacts/stats_player_week_2026.csv \
            https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv
          python scripts/build_week1_2026_player_truth.py \
            --stats artifacts/stats_player_week_2026.csv \
            --games benchmarks/week1_2026_sunday_games.csv \
            --out artifacts/truth

      - name: Grade control and challenger identically
        working-directory: benchmark
        run: |
          python scripts/audit_week1_reality_benchmark.py \
            --simulation ../control/artifacts/v638-control \
            --games benchmarks/week1_2026_sunday_games.csv \
            --player-truth artifacts/truth/week1_2026_player_truth.csv \
            --out artifacts/v638-control-reality \
            --label frozen-v638-control
          python scripts/audit_week1_reality_benchmark.py \
            --simulation ../challenger/artifacts/v639-challenger \
            --games benchmarks/week1_2026_sunday_games.csv \
            --player-truth artifacts/truth/week1_2026_player_truth.csv \
            --out artifacts/v639-challenger-reality \
            --label v639-pretruth-gadget-entry-calibration

      - name: Compare final v6 paired Week 1 evidence
        run: >-
          challenger/.venv/bin/python challenger/scripts/compare_week1_v638_v639.py
          --control benchmark/artifacts/v638-control-reality
          --challenger benchmark/artifacts/v639-challenger-reality
          --out benchmark/artifacts/v639-paired-comparison

      - name: Preserve closeout provenance
        working-directory: benchmark
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "control_sha": os.environ["CONTROL_SHA"],
              "challenger_sha": os.environ["GITHUB_SHA"],
              "worlds_per_game_each_arm": int(os.environ["WORLDS"]),
              "shared_seed": int(os.environ["SEED"]),
              "common_random_numbers": True,
              "shared_pregame_inputs": True,
              "truth_consumed_only_after_both_simulations": True,
              "classification": "v639 final v6 paired closeout test",
              "single_mechanism_change": (
                  "WR/TE designed-rush entry uses 2022-2025 OOS recurrence from raw prior-season carry evidence times current rotation exposure; all other v6.3.8 football authority remains frozen"
              ),
              "purpose": "freeze a reproducible v6 scientific baseline before v7 architecture work",
          }
          path = Path("artifacts/v639-paired-comparison/provenance.json")
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload final v6 closeout evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v639-final-closeout-${{ github.run_id }}
          path: |
            benchmark/artifacts/v639-coaching-policy/
            benchmark/artifacts/v639-counterfactual/
            benchmark/artifacts/v638-control-propagation/
            benchmark/artifacts/v639-propagation/
            benchmark/artifacts/truth/
            benchmark/artifacts/v638-control-reality/
            benchmark/artifacts/v639-challenger-reality/
            benchmark/artifacts/v639-paired-comparison/
            control/artifacts/v638-control/game_distributions.csv
            control/artifacts/v638-control/player_distributions.csv
            control/artifacts/v638-control/rushing_role_plan_audit.csv
            control/artifacts/v638-control/runtime_fingerprint_v638.json
            control/artifacts/v638-control/score_anatomy.json
            challenger/artifacts/v639-challenger/game_distributions.csv
            challenger/artifacts/v639-challenger/player_distributions.csv
            challenger/artifacts/v639-challenger/rushing_role_plan_audit.csv
            challenger/artifacts/v639-challenger/runtime_fingerprint_v639.json
            challenger/artifacts/v639-challenger/matchup_identity_trace_v634.csv
            challenger/artifacts/v639-challenger/score_anatomy.json
          retention-days: 30
