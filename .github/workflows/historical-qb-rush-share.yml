name: Historical QB rush-share calibration

on:
  push:
    branches:
      - feature/slate-simulator-v1
    paths:
      - scripts/audit_historical_qb_rush_share.py
      - .github/workflows/historical-qb-rush-share.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Measure historical starting-QB rush share
        run: >-
          uv run python scripts/audit_historical_qb_rush_share.py
          --seasons 2022,2023,2024,2025
          --out artifacts/historical-qb-rush-share
      - name: Show calibration
        run: cat artifacts/historical-qb-rush-share/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: monster-historical-qb-rush-share
          path: artifacts/historical-qb-rush-share/
          retention-days: 7
