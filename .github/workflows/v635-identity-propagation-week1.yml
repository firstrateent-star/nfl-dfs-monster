name: v6.3.5 Identity Propagation Paired Week 1

on:
  push:
    branches: [work/v635-identity-propagation-role-separation]
    paths:
      - benchmarks/v635_launch_marker.txt
  workflow_dispatch:
    inputs:
      worlds:
        description: Worlds per game for each paired arm
        required: true
        default: '300'
      seed:
        description: Shared deterministic seed
        required: true
        default: '2026091701'

permissions:
  contents: read
  actions: read

jobs:
  code-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Run v6.3.5 causal gates
        run: >-
          uv run pytest -q
          tests/test_identity_propagation_role_v635.py
          tests/test_matchup_identity_authority_v634.py
          tests/test_current_role_guard_v63.py
          tests/test_player_duel_authority_v6.py
          tests/test_reality_loop_v2_identity_authority.py
      - name: Lint changed runtime
        run: >-
          uv run ruff check
          src/monster/sim/current_role_guard_v635.py
          src/monster/sim/play_kernel.py
          scripts/run_reality_loop_v635.py
          scripts/audit_identity_dynamic_range_v635.py
          scripts/audit_coaching_policy_identity_v635.py
          scripts/audit_full_game_counterfactual_v635.py
          scripts/compare_week1_v634_v635.py
          tests/test_identity_propagation_role_v635.py
          --ignore RUF046

  paired-week1:
    needs: code-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CONTROL_SHA: 13cf6a41e672fd262d7c4a9675fb2aa9ac0ac399
      WORLDS: ${{ github.event.inputs.worlds || '300' }}
      SEED: ${{ github.event.inputs.seed || '2026091701' }}
    steps:
      - name: Checkout v6.3.5 challenger
        uses: actions/checkout@v4
        with:
          path: challenger

      - name: Checkout permanent Week 1 benchmark
        uses: actions/checkout@v4
        with:
          ref: work/week1-reality-benchmark-v1
          path: benchmark

      - name: Checkout frozen v6.3.4 control
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROL_SHA }}
          path: control

      - uses: astral-sh/setup-uv@v6

      - name: Install control dependencies
        working-directory: control
        run: uv sync --extra dev

      - name: Install challenger dependencies
        working-directory: challenger
        run: uv sync --extra dev

      - name: Build one shared leakage-resistant Week 1 input world
        working-directory: control
        run: |
          uv run python ../benchmark/scripts/build_week1_2026_pregame_baseline.py             --season 2026 --history 2025 --recent-games 6             --out artifacts/week1-pregame-baseline
          uv run python scripts/build_league_policy.py             --history 2025 --out artifacts/league-policy
          uv run python scripts/build_league_policy.py             --history 2024 --out artifacts/league-policy-2024
          uv run python scripts/build_health_snapshot.py             --personnel artifacts/week1-pregame-baseline/league_personnel.parquet             --injuries artifacts/week1-pregame-baseline/raw_injuries.parquet             --overrides config/health/week1_2026_2026-09-07.csv             --season 2026 --out artifacts/week1-health
          uv run python scripts/build_continuity_conditioned_policy.py             --older-policy artifacts/league-policy-2024/team_policy.parquet             --latest-policy artifacts/league-policy/team_policy.parquet             --personnel artifacts/week1-health/health_personnel.parquet             --out artifacts/continuity-policy

      - name: Audit raw data to identity dynamic range
        working-directory: challenger
        run: >-
          uv run python scripts/audit_identity_dynamic_range_v635.py
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --game-date 2026-09-13
          --out ../benchmark/artifacts/v635-dynamic-range

      - name: Audit actual coaching policy differentiation
        working-directory: challenger
        run: >-
          uv run python scripts/audit_coaching_policy_identity_v635.py
          --policy ../control/artifacts/continuity-policy/team_policy.parquet
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --player-usage ../control/artifacts/league-policy/player_usage.parquet
          --situation-context ../control/artifacts/league-policy/situational_pass_context.parquet
          --out ../benchmark/artifacts/v635-coaching-policy

      - name: Run common-seed full-game QB propagation counterfactual
        working-directory: challenger
        run: >-
          uv run python scripts/audit_full_game_counterfactual_v635.py
          --policy ../control/artifacts/continuity-policy/team_policy.parquet
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --player-usage ../control/artifacts/league-policy/player_usage.parquet
          --situation-context ../control/artifacts/league-policy/situational_pass_context.parquet
          --worlds 15
          --seed 6351701
          --out ../benchmark/artifacts/v635-counterfactual

      - name: Require full-game QB signal to propagate directionally
        working-directory: benchmark
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(
              Path("artifacts/v635-counterfactual/v635_full_game_qb_counterfactual.json").read_text()
          )
          if report["teams_with_positive_passing_yards_response"] < 20:
              raise SystemExit(f"QB identity failed passing propagation: {report}")
          if report["median_passing_yards_high_minus_low"] <= 0:
              raise SystemExit(f"QB identity has no median passing response: {report}")
          PY

      - name: Run frozen v6.3.4 control
        working-directory: control
        run: >-
          uv run python scripts/run_reality_loop_v634.py
          --policy artifacts/continuity-policy/team_policy.parquet
          --personnel artifacts/week1-health/health_personnel.parquet
          --player-usage artifacts/league-policy/player_usage.parquet
          --situation-context artifacts/league-policy/situational_pass_context.parquet
          --worlds "$WORLDS"
          --seed "$SEED"
          --progress-every 100
          --first-out artifacts/v634-control
          --box-out artifacts/v634-control-box

      - name: Run v6.3.5 challenger on identical inputs and seed
        working-directory: challenger
        run: >-
          uv run python scripts/run_reality_loop_v635.py
          --policy ../control/artifacts/continuity-policy/team_policy.parquet
          --personnel ../control/artifacts/week1-health/health_personnel.parquet
          --player-usage ../control/artifacts/league-policy/player_usage.parquet
          --situation-context ../control/artifacts/league-policy/situational_pass_context.parquet
          --worlds "$WORLDS"
          --seed "$SEED"
          --progress-every 100
          --first-out artifacts/v635-challenger
          --box-out artifacts/v635-challenger-box

      - name: Audit role translation and score anatomy
        run: |
          cd control
          uv run python scripts/audit_role_snap_opportunity_v63.py             --simulation artifacts/v634-control
          uv run python scripts/audit_reality_loop_v2_score_anatomy.py             --simulation artifacts/v634-control --history 2025             --out artifacts/v634-control
          cd ../challenger
          uv run python scripts/audit_role_snap_opportunity_v63.py             --simulation artifacts/v635-challenger
          uv run python scripts/audit_reality_loop_v2_score_anatomy.py             --simulation artifacts/v635-challenger --history 2025             --out artifacts/v635-challenger

      - name: Audit full-world identity propagation in both arms
        run: |
          challenger/.venv/bin/python challenger/scripts/audit_identity_propagation_v634.py             --simulation control/artifacts/v634-control             --out benchmark/artifacts/v634-propagation
          challenger/.venv/bin/python challenger/scripts/audit_identity_propagation_v634.py             --simulation challenger/artifacts/v635-challenger             --out benchmark/artifacts/v635-propagation

      - name: Download finalized Week 1 truth after simulations
        working-directory: benchmark
        run: |
          mkdir -p artifacts
          curl --fail --location --retry 3             --output artifacts/stats_player_week_2026.csv             https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv
          python scripts/build_week1_2026_player_truth.py             --stats artifacts/stats_player_week_2026.csv             --games benchmarks/week1_2026_sunday_games.csv             --out artifacts/truth

      - name: Grade control and challenger identically
        working-directory: benchmark
        run: |
          python scripts/audit_week1_reality_benchmark.py             --simulation ../control/artifacts/v634-control             --games benchmarks/week1_2026_sunday_games.csv             --player-truth artifacts/truth/week1_2026_player_truth.csv             --out artifacts/v634-control-reality             --label frozen-v634-control
          python scripts/audit_week1_reality_benchmark.py             --simulation ../challenger/artifacts/v635-challenger             --games benchmarks/week1_2026_sunday_games.csv             --player-truth artifacts/truth/week1_2026_player_truth.csv             --out artifacts/v635-challenger-reality             --label v635-identity-propagation-challenger

      - name: Compare paired Week 1 evidence
        run: >-
          challenger/.venv/bin/python challenger/scripts/compare_week1_v634_v635.py
          --control benchmark/artifacts/v634-control-reality
          --challenger benchmark/artifacts/v635-challenger-reality
          --out benchmark/artifacts/v635-paired-comparison

      - name: Preserve provenance
        working-directory: benchmark
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "control_sha": os.environ["CONTROL_SHA"],
              "challenger_sha": os.environ["GITHUB_SHA"],
              "worlds_per_game_each_arm": int(os.environ["WORLDS"]),
              "shared_seed": int(os.environ["SEED"]),
              "common_random_numbers": True,
              "shared_pregame_inputs": True,
              "truth_consumed_only_after_both_simulations": True,
              "classification": "v635 paired shadow architecture test",
          }
          path = Path("artifacts/v635-paired-comparison/provenance.json")
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload v6.3.5 evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monster-v635-week1-paired-${{ github.run_id }}
          path: |
            benchmark/artifacts/v635-dynamic-range/
            benchmark/artifacts/v635-coaching-policy/
            benchmark/artifacts/v635-counterfactual/
            benchmark/artifacts/v634-propagation/
            benchmark/artifacts/v635-propagation/
            benchmark/artifacts/truth/
            benchmark/artifacts/v634-control-reality/
            benchmark/artifacts/v635-challenger-reality/
            benchmark/artifacts/v635-paired-comparison/
            control/artifacts/v634-control/game_distributions.csv
            control/artifacts/v634-control/player_distributions.csv
            control/artifacts/v634-control/score_anatomy.json
            challenger/artifacts/v635-challenger/game_distributions.csv
            challenger/artifacts/v635-challenger/player_distributions.csv
            challenger/artifacts/v635-challenger/matchup_identity_trace_v634.csv
            challenger/artifacts/v635-challenger/score_anatomy.json
          retention-days: 30
